<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monster Rush - JavaScript Game</title>


    <!-- =========================================================
         GOOGLE FONT
    ========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           1. VARIABLES
        ========================================================== */

        :root {

            --bg: #1B1035;
            --panel: #2A1B54;
            --panel-soft: #362268;

            --accent: #FFD23F;
            --accent-dark: #EABF20;

            --correct: #4ADE80;
            --wrong: #FB6F92;

            --blue: #60A5FA;
            --purple: #A78BFA;

            --text: #F5F3FF;
            --text-soft: #C9C2E8;

            --display: "Fredoka", sans-serif;
            --body: "Nunito", sans-serif;

        }


        /* =========================================================
           2. RESET
        ========================================================== */

        * {

            box-sizing: border-box;

        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #382267 0%,
                    var(--bg) 50%
                );

            color: var(--text);

            font-family: var(--body);

        }


        /* =========================================================
           3. GAME CONTAINER
        ========================================================== */

        .game {

            width: 100%;

            max-width: 440px;

        }


        /* =========================================================
           4. SCREEN
        ========================================================== */

        .layar {

            display: none;

        }


        .layar.aktif {

            display: block;

        }


        /* =========================================================
           5. PANEL
        ========================================================== */

        .panel {

            background: var(--panel);

            border:
                2px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 26px;

            padding: 24px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);

        }


        /* =========================================================
           6. START SCREEN
        ========================================================== */

        .logo {

            width: 90px;

            height: 90px;

            margin:
                0 auto 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: var(--accent);

            border-radius: 28px;

            font-size: 48px;

            box-shadow:
                0 8px 0
                var(--accent-dark);

        }


        h1 {

            margin: 0;

            text-align: center;

            color: var(--accent);

            font-family: var(--display);

            font-size: 38px;

            font-weight: 700;

        }


        .subtitle {

            margin:
                8px 0 22px;

            color: var(--text-soft);

            text-align: center;

            line-height: 1.5;

        }


        /* =========================================================
           7. INPUT
        ========================================================== */

        .input-label {

            display: block;

            margin-bottom: 8px;

            font-weight: 800;

        }


        input {

            width: 100%;

            padding:
                14px 16px;

            border: 2px solid transparent;

            border-radius: 14px;

            background: var(--panel-soft);

            color: var(--text);

            outline: none;

            font-family: var(--body);

            font-size: 16px;

        }


        input:focus {

            border-color: var(--accent);

        }


        /* =========================================================
           8. BUTTON
        ========================================================== */

        button {

            border: none;

            border-radius: 14px;

            padding:
                13px 18px;

            font-family: var(--body);

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.15s;

        }


        button:hover {

            transform:
                translateY(-2px);

        }


        button:active {

            transform:
                translateY(1px);

        }


        .primary {

            width: 100%;

            margin-top: 18px;

            background: var(--accent);

            color: #25183F;

            box-shadow:
                0 5px 0
                var(--accent-dark);

        }


        /* =========================================================
           9. FEATURES
        ========================================================== */

        .features {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 22px;

        }


        .feature {

            padding: 12px 5px;

            border-radius: 14px;

            background: var(--panel-soft);

            text-align: center;

            font-size: 12px;

            font-weight: 800;

        }


        .feature-icon {

            display: block;

            margin-bottom: 5px;

            font-size: 23px;

        }


        /* =========================================================
           10. HUD
        ========================================================== */

        .hud {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 7px;

            margin-bottom: 10px;

        }


        .hud-card {

            padding:
                9px 5px;

            border-radius: 14px;

            background: var(--panel);

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            text-align: center;

        }


        .hud-label {

            display: block;

            color: var(--text-soft);

            font-size: 9px;

            text-transform: uppercase;

        }


        .hud-value {

            display: block;

            margin-top: 2px;

            color: var(--text);

            font-family: var(--display);

            font-size: 16px;

        }


        /* =========================================================
           11. GAME BOX
        ========================================================== */

        .game-box {

            padding: 8px;

            border-radius: 22px;

            background: var(--panel);

            border:
                2px solid
                rgba(255, 255, 255, 0.08);

        }


        canvas {

            width: 100%;

            height: auto;

            display: block;

            border-radius: 16px;

        }


        /* =========================================================
           12. OBJECTIVE
        ========================================================== */

        .objective {

            margin-top: 10px;

            padding:
                11px 14px;

            border-radius: 14px;

            background: var(--panel);

            color: var(--text-soft);

            font-size: 13px;

            text-align: center;

        }


        /* =========================================================
           13. MOBILE CONTROLS
        ========================================================== */

        .controls {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 10px;

        }


        .control {

            height: 48px;

            background: var(--panel);

            color: var(--text);

            border:
                2px solid
                rgba(255, 255, 255, 0.08);

            font-size: 20px;

            touch-action: none;

            user-select: none;

        }


        .control.up {

            background: var(--accent);

            color: #25183F;

        }


        /* =========================================================
           14. RESULT
        ========================================================== */

        .result-icon {

            width: 90px;

            height: 90px;

            margin:
                0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: var(--accent);

            border-radius: 28px;

            font-size: 48px;

        }


        .result-score {

            margin:
                18px 0;

            text-align: center;

        }


        .result-score span {

            display: block;

            color: var(--text-soft);

        }


        .result-score strong {

            display: block;

            margin-top: 4px;

            color: var(--accent);

            font-family: var(--display);

            font-size: 48px;

        }


        .result-message {

            color: var(--text-soft);

            text-align: center;

            line-height: 1.5;

        }


        /* =========================================================
           15. FOOTER
        ========================================================== */

        footer {

            margin-top: 14px;

            color: #8F87B4;

            text-align: center;

            font-size: 11px;

        }

    </style>

</head>


<body>


<div class="game">


    <!-- =========================================================
         START SCREEN
    ========================================================== -->

    <section
        id="startScreen"
        class="layar aktif"
    >

        <div class="panel">

            <div
                id="gameLogo"
                class="logo"
            >
                🚀
            </div>


            <h1>
                Monster Rush
            </h1>


            <p class="subtitle">

                Bertahan selama 30 detik,
                kumpulkan coin,
                dan hindari monster!

            </p>


            <label class="input-label">

                Nama Player

            </label>


            <input
                id="nameInput"
                type="text"
                maxlength="15"
                placeholder="Masukkan nama kamu..."
            >


            <button
                id="startButton"
                class="primary"
            >

                MULAI GAME

            </button>


            <div class="features">

                <div class="feature">

                    <span
                        id="featureCharacter"
                        class="feature-icon"
                    >
                        🚀
                    </span>

                    Survive

                </div>


                <div class="feature">

                    <span
                        id="featureObject"
                        class="feature-icon"
                    >
                        🪙
                    </span>

                    Collect

                </div>


                <div class="feature">

                    <span
                        id="featureEnemy"
                        class="feature-icon"
                    >
                        👾
                    </span>

                    Dodge

                </div>

            </div>

        </div>

    </section>



    <!-- =========================================================
         GAME SCREEN
    ========================================================== -->

    <section
        id="gameScreen"
        class="layar"
    >

        <div class="hud">


            <div class="hud-card">

                <span class="hud-label">
                    Score
                </span>

                <span
                    id="score"
                    class="hud-value"
                >
                    0
                </span>

            </div>


            <div class="hud-card">

                <span class="hud-label">
                    Lives
                </span>

                <span
                    id="lives"
                    class="hud-value"
                >
                    ❤️ 3
                </span>

            </div>


            <div class="hud-card">

                <span class="hud-label">
                    Time
                </span>

                <span
                    id="time"
                    class="hud-value"
                >
                    30
                </span>

            </div>


            <div class="hud-card">

                <span class="hud-label">
                    Level
                </span>

                <span
                    id="level"
                    class="hud-value"
                >
                    1
                </span>

            </div>


        </div>


        <div class="game-box">

            <canvas
                id="gameCanvas"
                width="400"
                height="500"
            ></canvas>

        </div>


        <div
            id="objective"
            class="objective"
        >

            🪙 Kumpulkan coin dan hindari monster!

        </div>


        <!-- Mobile controls -->

        <div class="controls">

            <button
                class="control"
                id="leftButton"
            >
                ◀
            </button>


            <button
                class="control up"
                id="upButton"
            >
                ▲
            </button>


            <button
                class="control"
                id="rightButton"
            >
                ▶
            </button>


            <div></div>


            <button
                class="control"
                id="downButton"
            >
                ▼
            </button>


            <div></div>

        </div>

    </section>



    <!-- =========================================================
         RESULT SCREEN
    ========================================================== -->

    <section
        id="resultScreen"
        class="layar"
    >

        <div class="panel">


            <div
                id="resultIcon"
                class="result-icon"
            >
                🏆
            </div>


            <h1 id="resultTitle">

                Kamu Berhasil!

            </h1>


            <div class="result-score">

                <span>
                    Final Score
                </span>

                <strong id="finalScore">
                    0
                </strong>

            </div>


            <p
                id="resultMessage"
                class="result-message"
            >

                Kamu berhasil bertahan!

            </p>


            <button
                id="playAgainButton"
                class="primary"
            >

                MAIN LAGI

            </button>

        </div>

    </section>


    <footer>

        Dibuat untuk belajar JavaScript

    </footer>


</div>



<script>


    /* ============================================================
       ⭐⭐⭐ CUSTOMIZATION AREA ⭐⭐⭐
       
       MURID CUKUP MENGUBAH BAGIAN INI.

       1. CHARACTER = karakter pemain
       2. OBJECT    = object dalam game
       3. BACKGROUND = suasana/background game
       
       Tidak perlu mengubah kode di bawahnya.
    ============================================================ */


    /* ============================================================
       ⭐ 1. CHARACTER
       
       Mengatur karakter yang dimainkan oleh player.
    ============================================================ */

    const CHARACTER = {

        // ⭐ Ubah karakter di sini
        emoji: "💵",

        // Ukuran karakter
        size: 30,

        // Kecepatan karakter
        speed: 1.8

    };


    /* ============================================================
       ⭐ 2. OBJECT
       
       Mengatur object dalam game.
       
       enemy  = object yang harus dihindari
       coin   = object yang dapat dikumpulkan
       power  = object power-up
    ============================================================ */

    const OBJECT = {

        // ⭐ Object yang harus dihindari
        enemy: "💳",

        // ⭐ Object yang dikumpulkan
        coin: "💰",

        // ⭐ Object power-up
        power: "✨"

    };


    /* ============================================================
       ⭐ 3. BACKGROUND
       
       Mengatur suasana game.
    ============================================================ */

    const BACKGROUND = {

        // ⭐ Warna background utama
        topColor: "#5DB7E1",

        // ⭐ Warna bagian bawah background
        bottomColor: "#B5E7FA",

        // ⭐ Warna grid
        gridColor: "rgba(255,255,255,0.12)",

        // ⭐ Warna dekorasi
        decorationColor: "#FFF2B0",

        // ⭐ Bentuk dekorasi
        decoration: "⭐"

    };


    /* ============================================================
       GAME SETUP
       Mulai dari sini adalah kode game.
       
       Untuk pembelajaran customization,
       murid tidak perlu mengubah bagian ini.
    ============================================================ */


    /* ============================================================
       1. GET HTML ELEMENTS
    ============================================================ */

    const canvas =
        document.getElementById("gameCanvas");

    const ctx =
        canvas.getContext("2d");


    const scoreElement =
        document.getElementById("score");

    const livesElement =
        document.getElementById("lives");

    const timeElement =
        document.getElementById("time");

    const levelElement =
        document.getElementById("level");


    const startScreen =
        document.getElementById("startScreen");

    const gameScreen =
        document.getElementById("gameScreen");

    const resultScreen =
        document.getElementById("resultScreen");


    const objective =
        document.getElementById("objective");


    /* ============================================================
       2. APPLY CUSTOMIZATION TO HTML
    ============================================================ */

    document.getElementById(
        "gameLogo"
    ).textContent =
        CHARACTER.emoji;


    document.getElementById(
        "featureCharacter"
    ).textContent =
        CHARACTER.emoji;


    document.getElementById(
        "featureObject"
    ).textContent =
        OBJECT.coin;


    document.getElementById(
        "featureEnemy"
    ).textContent =
        OBJECT.enemy;


    /* ============================================================
       3. GAME STATE
    ============================================================ */

    let gameState = "ready";

    let score = 0;

    let lives = 3;

    let timeLeft = 30;

    let level = 1;

    let combo = 0;

    let gameTimer;

    let spawnTimer;


    /* ============================================================
       4. PLAYER
    ============================================================ */

    const player = {

        x: 185,

        y: 235,

        width:
            CHARACTER.size,

        height:
            CHARACTER.size,

        speed:
            CHARACTER.speed,

        invincible: 0

    };


    /* ============================================================
       5. KEYBOARD
    ============================================================ */

    const keys = {};


    document.addEventListener(
        "keydown",
        function(event) {

            keys[
                event.key.toLowerCase()
            ] = true;

        }
    );


    document.addEventListener(
        "keyup",
        function(event) {

            keys[
                event.key.toLowerCase()
            ] = false;

        }
    );


    /* ============================================================
       6. MOBILE INPUT
    ============================================================ */

    function setupControl(
        buttonId,
        key
    ) {

        const button =
            document.getElementById(
                buttonId
            );


        button.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                keys[key] = true;

            }
        );


        button.addEventListener(
            "pointerup",
            function(event) {

                event.preventDefault();

                keys[key] = false;

            }
        );


        button.addEventListener(
            "pointerleave",
            function() {

                keys[key] = false;

            }
        );

    }


    setupControl(
        "leftButton",
        "arrowleft"
    );


    setupControl(
        "rightButton",
        "arrowright"
    );


    setupControl(
        "upButton",
        "arrowup"
    );


    setupControl(
        "downButton",
        "arrowdown"
    );


    /* ============================================================
       7. ENEMIES
    ============================================================ */

    let enemies = [];


    /* ============================================================
       8. COINS
    ============================================================ */

    let coins = [];


    /* ============================================================
       9. POWER UPS
    ============================================================ */

    let powerUps = [];


    /* ============================================================
       10. PARTICLES
    ============================================================ */

    let particles = [];


    /* ============================================================
       11. RANDOM NUMBER
    ============================================================ */

    function randomNumber(
        min,
        max
    ) {

        return Math.floor(
            Math.random() *
            (max - min + 1)
        ) + min;

    }


    /* ============================================================
       12. CREATE ENEMY
    ============================================================ */

    function createEnemy() {

        const side =
            randomNumber(0, 3);


        let x;

        let y;


        if (side === 0) {

            x = -40;

            y =
                randomNumber(
                    20,
                    canvas.height - 50
                );

        }


        if (side === 1) {

            x =
                canvas.width + 40;

            y =
                randomNumber(
                    20,
                    canvas.height - 50
                );

        }


        if (side === 2) {

            x =
                randomNumber(
                    20,
                    canvas.width - 50
                );

            y = -40;

        }


        if (side === 3) {

            x =
                randomNumber(
                    20,
                    canvas.width - 50
                );

            y =
                canvas.height + 40;

        }


        enemies.push({

            x: x,

            y: y,

            width: 30,

            height: 30,

            speed:
                1.3 +
                level * 0.25,

            type:
                Math.random() > 0.7
                    ? "fast"
                    : "normal"

        });

    }


    /* ============================================================
       13. CREATE COIN
    ============================================================ */

    function createCoin() {

        coins.push({

            x:
                randomNumber(
                    25,
                    canvas.width - 45
                ),

            y:
                randomNumber(
                    25,
                    canvas.height - 45
                ),

            width: 20,

            height: 20,

            rotation: 0

        });

    }


    /* ============================================================
       14. CREATE POWER UP
    ============================================================ */

    function createPowerUp() {

        powerUps.push({

            x:
                randomNumber(
                    25,
                    canvas.width - 45
                ),

            y:
                randomNumber(
                    25,
                    canvas.height - 45
                ),

            width: 24,

            height: 24,

            type: "shield"

        });

    }


    /* ============================================================
       15. COLLISION
    ============================================================ */

    function isColliding(
        a,
        b
    ) {

        return (

            a.x <
            b.x + b.width &&

            a.x + a.width >
            b.x &&

            a.y <
            b.y + b.height &&

            a.y + a.height >
            b.y

        );

    }


    /* ============================================================
       16. MOVE PLAYER
    ============================================================ */

    function movePlayer() {

        if (
            keys["arrowup"] ||
            keys["w"]
        ) {

            player.y -=
                player.speed;

        }


        if (
            keys["arrowdown"] ||
            keys["s"]
        ) {

            player.y +=
                player.speed;

        }


        if (
            keys["arrowleft"] ||
            keys["a"]
        ) {

            player.x -=
                player.speed;

        }


        if (
            keys["arrowright"] ||
            keys["d"]
        ) {

            player.x +=
                player.speed;

        }


        if (player.x < 0) {

            player.x = 0;

        }


        if (
            player.x +
            player.width >
            canvas.width
        ) {

            player.x =
                canvas.width -
                player.width;

        }


        if (player.y < 0) {

            player.y = 0;

        }


        if (
            player.y +
            player.height >
            canvas.height
        ) {

            player.y =
                canvas.height -
                player.height;

        }


        if (
            player.invincible > 0
        ) {

            player.invincible -= 1;

        }

    }


    /* ============================================================
       17. MOVE ENEMIES
    ============================================================ */

    function moveEnemies() {

        enemies.forEach(
            function(enemy) {

                const dx =
                    player.x -
                    enemy.x;

                const dy =
                    player.y -
                    enemy.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (distance > 0) {

                    const speed =
                        enemy.speed *
                        (
                            enemy.type === "fast"
                                ? 0.7
                                : 0.15
                        );


                    enemy.x +=
                        (dx / distance) *
                        speed;


                    enemy.y +=
                        (dy / distance) *
                        speed;

                }

            }
        );

    }


    /* ============================================================
       18. UPDATE COINS
    ============================================================ */

    function updateCoins() {

        coins.forEach(
            function(coin) {

                coin.rotation += 0.1;

            }
        );

    }


    /* ============================================================
       19. CHECK ENEMY COLLISION
    ============================================================ */

    function checkEnemyCollision() {

        enemies.forEach(
            function(enemy) {

                if (
                    player.invincible > 0
                ) {

                    return;

                }


                if (
                    isColliding(
                        player,
                        enemy
                    )
                ) {

                    lives--;

                    combo = 0;


                    livesElement.textContent =
                        "❤️ " + lives;


                    player.x = 185;

                    player.y = 235;


                    player.invincible =
                        120;


                    createHitParticles(
                        player.x,
                        player.y
                    );


                    if (lives <= 0) {

                        gameOver();

                    }

                }

            }
        );

    }


    /* ============================================================
       20. CHECK COIN COLLISION
    ============================================================ */

    function checkCoinCollision() {

        for (
            let i = coins.length - 1;
            i >= 0;
            i--
        ) {

            const coin =
                coins[i];


            if (
                isColliding(
                    player,
                    coin
                )
            ) {

                combo++;


                const bonus =
                    combo >= 5
                        ? 20
                        : 10;


                score += bonus;


                scoreElement.textContent =
                    score;


                createCoinParticles(
                    coin.x,
                    coin.y
                );


                coins.splice(
                    i,
                    1
                );


                objective.textContent =
                    combo >= 5
                        ? "🔥 COMBO! Terus kumpulkan coin!"
                        : `${OBJECT.coin} Object dikumpulkan!`;

            }

        }

    }


    /* ============================================================
       21. CHECK POWER UP
    ============================================================ */

    function checkPowerUpCollision() {

        for (
            let i = powerUps.length - 1;
            i >= 0;
            i--
        ) {

            const power =
                powerUps[i];


            if (
                isColliding(
                    player,
                    power
                )
            ) {

                player.invincible =
                    300;


                score += 50;


                scoreElement.textContent =
                    score;


                powerUps.splice(
                    i,
                    1
                );


                objective.textContent =
                    `${OBJECT.power} SHIELD AKTIF! Kamu kebal sementara.`;

            }

        }

    }


    /* ============================================================
       22. LEVEL SYSTEM
    ============================================================ */

    function updateLevel() {

        const newLevel =
            Math.floor(
                score / 100
            ) + 1;


        if (
            newLevel !== level
        ) {

            level =
                Math.min(
                    newLevel,
                    5
                );


            levelElement.textContent =
                level;


            objective.textContent =
                `🚀 Level ${level}! Monster menjadi lebih cepat!`;

        }

    }


    /* ============================================================
       23. SPAWN OBJECTS
    ============================================================ */

    function spawnObjects() {

        if (
            gameState !== "playing"
        ) {

            return;

        }


        if (
            coins.length < 2
        ) {

            createCoin();

        }


        const maxEnemies =
            Math.min(
                2 + level,
                7
            );


        if (
            enemies.length <
            maxEnemies
        ) {

            createEnemy();

        }


        if (
            Math.random() < 0.03 &&
            powerUps.length === 0
        ) {

            createPowerUp();

        }

    }


    /* ============================================================
       24. PARTICLE
    ============================================================ */

    function createCoinParticles(
        x,
        y
    ) {

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            particles.push({

                x: x + 10,

                y: y + 10,

                vx:
                    (Math.random() - 0.5) *
                    4,

                vy:
                    (Math.random() - 0.5) *
                    4,

                life: 30

            });

        }

    }


    function createHitParticles(
        x,
        y
    ) {

        for (
            let i = 0;
            i < 18;
            i++
        ) {

            particles.push({

                x: x + 15,

                y: y + 15,

                vx:
                    (Math.random() - 0.5) *
                    6,

                vy:
                    (Math.random() - 0.5) *
                    6,

                life: 40

            });

        }

    }


    /* ============================================================
       25. UPDATE PARTICLES
    ============================================================ */

    function updateParticles() {

        particles.forEach(
            function(particle) {

                particle.x +=
                    particle.vx;

                particle.y +=
                    particle.vy;

                particle.life--;

            }
        );


        particles =
            particles.filter(
                function(particle) {

                    return particle.life > 0;

                }
            );

    }


    /* ============================================================
       26. UPDATE GAME
    ============================================================ */

    function update() {

        if (
            gameState !== "playing"
        ) {

            return;

        }


        movePlayer();

        moveEnemies();

        updateCoins();

        updateParticles();

        checkEnemyCollision();

        checkCoinCollision();

        checkPowerUpCollision();

        updateLevel();

    }


    /* ============================================================
       ⭐ 27. DRAW BACKGROUND
       
       BAGIAN BACKGROUND
       
       Untuk mengganti tema background,
       murid cukup mengubah:
       
       BACKGROUND.topColor
       BACKGROUND.bottomColor
       BACKGROUND.gridColor
       BACKGROUND.decorationColor
       BACKGROUND.decoration
    ============================================================ */

    function drawBackground() {


        // ⭐ BACKGROUND COLOR

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                canvas.height
            );


        gradient.addColorStop(
            0,
            BACKGROUND.topColor
        );


        gradient.addColorStop(
            1,
            BACKGROUND.bottomColor
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // ⭐ BACKGROUND GRID

        ctx.strokeStyle =
            BACKGROUND.gridColor;


        ctx.lineWidth = 1;


        for (
            let x = 0;
            x < canvas.width;
            x += 40
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x,
                0
            );

            ctx.lineTo(
                x,
                canvas.height
            );

            ctx.stroke();

        }


        for (
            let y = 0;
            y < canvas.height;
            y += 40
        ) {

            ctx.beginPath();

            ctx.moveTo(
                0,
                y
            );

            ctx.lineTo(
                canvas.width,
                y
            );

            ctx.stroke();

        }


        // ⭐ BACKGROUND DECORATION

        ctx.fillStyle =
            BACKGROUND.decorationColor;


        const decorations = [

            [30, 35],
            [90, 75],
            [160, 30],
            [240, 80],
            [320, 35],
            [370, 120],
            [60, 170],
            [350, 230],
            [25, 330],
            [370, 390]

        ];


        decorations.forEach(
            function(item) {

                ctx.font =
                    "16px Arial";

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    BACKGROUND.decoration,
                    item[0],
                    item[1]
                );

            }
        );

    }


    /* ============================================================
       ⭐ 28. DRAW CHARACTER
       
       BAGIAN CHARACTER
       
       Karakter sekarang menggunakan emoji.
       Jadi murid tidak perlu memahami Canvas drawing
       untuk mengganti karakter.
    ============================================================ */

    function drawPlayer() {


        // Blink while invincible

        if (
            player.invincible > 0 &&
            Math.floor(
                player.invincible / 8
            ) % 2 === 0
        ) {

            return;

        }


        // Shadow

        ctx.fillStyle =
            "rgba(0,0,0,0.3)";


        ctx.beginPath();

        ctx.ellipse(
            player.x + 15,
            player.y + 32,
            15,
            5,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* ========================================================
           ⭐ CHARACTER
           
           Ubah karakter melalui:
           
           CHARACTER.emoji
        ======================================================== */

        ctx.font =
            CHARACTER.size + "px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(
            CHARACTER.emoji,
            player.x + player.width / 2,
            player.y + player.height / 2
        );


        // Shield

        if (
            player.invincible > 0
        ) {

            ctx.strokeStyle =
                "#60A5FA";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                player.x + 15,
                player.y + 15,
                23,
                0,
                Math.PI * 2
            );

            ctx.stroke();

        }

    }


    /* ============================================================
       ⭐ 29. DRAW OBJECT / ENEMY
       
       BAGIAN OBJECT
       
       Ubah monster melalui:
       
       OBJECT.enemy
    ============================================================ */

    function drawEnemies() {

        enemies.forEach(
            function(enemy) {


                // ⭐ OBJECT / ENEMY

                ctx.font =
                    enemy.width + "px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    OBJECT.enemy,
                    enemy.x + enemy.width / 2,
                    enemy.y + enemy.height / 2
                );

            }
        );

    }


    /* ============================================================
       ⭐ 30. DRAW COINS
       
       BAGIAN OBJECT
       
       Ubah coin melalui:
       
       OBJECT.coin
    ============================================================ */

    function drawCoins() {

        coins.forEach(
            function(coin) {


                const scale =
                    Math.abs(
                        Math.cos(
                            coin.rotation
                        )
                    );


                ctx.save();


                ctx.translate(
                    coin.x + 10,
                    coin.y + 10
                );


                ctx.scale(
                    scale,
                    1
                );


                // ⭐ OBJECT / COIN

                ctx.font =
                    "22px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    OBJECT.coin,
                    0,
                    0
                );


                ctx.restore();

            }
        );

    }


    /* ============================================================
       ⭐ 31. DRAW POWER UP
       
       BAGIAN OBJECT
       
       Ubah power-up melalui:
       
       OBJECT.power
    ============================================================ */

    function drawPowerUps() {

        powerUps.forEach(
            function(power) {


                // ⭐ OBJECT / POWER UP

                ctx.font =
                    "25px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    OBJECT.power,
                    power.x + 12,
                    power.y + 12
                );

            }
        );

    }


    /* ============================================================
       32. DRAW PARTICLES
    ============================================================ */

    function drawParticles() {

        particles.forEach(
            function(particle) {

                ctx.fillStyle =
                    "#FFD23F";


                ctx.globalAlpha =
                    particle.life / 40;


                ctx.fillRect(
                    particle.x,
                    particle.y,
                    4,
                    4
                );


                ctx.globalAlpha = 1;

            }
        );

    }


    /* ============================================================
       33. DRAW GAME
    ============================================================ */

    function draw() {

        drawBackground();

        drawCoins();

        drawPowerUps();

        drawEnemies();

        drawPlayer();

        drawParticles();


        if (
            gameState === "gameover"
        ) {

            drawOverlay(
                "GAME OVER",
                "Score: " + score
            );

        }


        if (
            gameState === "win"
        ) {

            drawOverlay(
                "YOU SURVIVED!",
                "Score: " + score
            );

        }

    }


    /* ============================================================
       34. DRAW OVERLAY
    ============================================================ */

    function drawOverlay(
        title,
        subtitle
    ) {

        ctx.fillStyle =
            "rgba(27,16,53,0.82)";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            "#FFD23F";


        ctx.font =
            "700 36px Fredoka";


        ctx.fillText(
            title,
            canvas.width / 2,
            canvas.height / 2 - 10
        );


        ctx.fillStyle =
            "#F5F3FF";


        ctx.font =
            "700 18px Nunito";


        ctx.fillText(
            subtitle,
            canvas.width / 2,
            canvas.height / 2 + 28
        );

    }


    /* ============================================================
       35. UPDATE HUD
    ============================================================ */

    function updateHUD() {

        scoreElement.textContent =
            score;


        livesElement.textContent =
            "❤️ " + lives;


        timeElement.textContent =
            timeLeft;


        levelElement.textContent =
            level;

    }


    /* ============================================================
       36. START GAME
    ============================================================ */

    function startGame() {

        const name =
            document
                .getElementById("nameInput")
                .value
                .trim();


        score = 0;

        lives = 3;

        timeLeft = 30;

        level = 1;

        combo = 0;


        player.x = 185;

        player.y = 235;

        player.invincible = 0;


        enemies = [];

        coins = [];

        powerUps = [];

        particles = [];


        gameState =
            "playing";


        startScreen
            .classList
            .remove("aktif");


        resultScreen
            .classList
            .remove("aktif");


        gameScreen
            .classList
            .add("aktif");


        objective.textContent =
            `${OBJECT.coin} Kumpulkan coin dan hindari ${OBJECT.enemy}!`;


        updateHUD();


        clearInterval(gameTimer);

        clearInterval(spawnTimer);


        /* Timer */

        gameTimer =
            setInterval(
                function() {

                    if (
                        gameState !==
                        "playing"
                    ) {

                        return;

                    }


                    timeLeft--;


                    updateHUD();


                    if (
                        timeLeft <= 0
                    ) {

                        winGame();

                    }

                },
                1000
            );


        /* Spawn timer */

        spawnTimer =
            setInterval(
                function() {

                    spawnObjects();

                },
                800
            );


        /* Initial objects */

        createCoin();

        createCoin();

        createEnemy();

        createEnemy();


        if (name) {

            objective.textContent =
                `🎮 Semangat, ${name}! Bertahan selama 30 detik!`;

        }

    }


    /* ============================================================
       37. GAME OVER
    ============================================================ */

    function gameOver() {

        gameState =
            "gameover";


        clearInterval(
            gameTimer
        );


        clearInterval(
            spawnTimer
        );


        showResult(false);

    }


    /* ============================================================
       38. WIN GAME
    ============================================================ */

    function winGame() {

        gameState =
            "win";


        clearInterval(
            gameTimer
        );


        clearInterval(
            spawnTimer
        );


        showResult(true);

    }


    /* ============================================================
       39. SHOW RESULT
    ============================================================ */

    function showResult(win) {

        gameScreen
            .classList
            .remove("aktif");


        resultScreen
            .classList
            .add("aktif");


        document.getElementById(
            "finalScore"
        ).textContent =
            score;


        const resultIcon =
            document.getElementById(
                "resultIcon"
            );


        const resultTitle =
            document.getElementById(
                "resultTitle"
            );


        const resultMessage =
            document.getElementById(
                "resultMessage"
            );


        if (win) {

            resultIcon.textContent =
                "🏆";


            resultTitle.textContent =
                "Kamu Berhasil!";


            resultMessage.textContent =
                `Hebat! Kamu berhasil bertahan selama 30 detik dengan score ${score}.`;

        } else {

            resultIcon.textContent =
                "💀";


            resultTitle.textContent =
                "Game Over";


            resultMessage.textContent =
                `Monster berhasil mengalahkanmu. Kamu mendapatkan score ${score}.`;

        }


        saveHighScore();

    }


    /* ============================================================
       40. HIGH SCORE
    ============================================================ */

    function saveHighScore() {

        const highScore =
            Number(
                localStorage.getItem(
                    "monsterRushHighScore"
                )
            ) || 0;


        if (
            score > highScore
        ) {

            localStorage.setItem(
                "monsterRushHighScore",
                score
            );

        }

    }


    /* ============================================================
       41. START BUTTON
    ============================================================ */

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            startGame
        );


    /* ============================================================
       42. PLAY AGAIN
    ============================================================ */

    document
        .getElementById("playAgainButton")
        .addEventListener(
            "click",
            function() {

                resultScreen
                    .classList
                    .remove("aktif");


                startScreen
                    .classList
                    .add("aktif");

            }
        );


    /* ============================================================
       43. ENTER TO START
    ============================================================ */

    document
        .getElementById("nameInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    startGame();

                }

            }
        );


    /* ============================================================
       44. GAME LOOP
    ============================================================ */

    function gameLoop() {

        update();

        draw();

        requestAnimationFrame(
            gameLoop
        );

    }


    /* ============================================================
       45. START LOOP
    ============================================================ */

    gameLoop();

</script>
